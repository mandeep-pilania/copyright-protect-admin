<section class="p-0">
  <div class="row">
    <div class="col-lg-12">
      <h5 class="mb-3">📋 All Enquiries</h5>
      <table class="table table-striped table-hover text-center">
        <thead class="bg-primary">
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Mobile</th>
            <th>Subject</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of AllEnquiries">
            <td>{{ item?.name | titlecase }}</td>
            <td>{{ item?.email }}</td>
            <td>{{ item?.mobile }}</td>
            <td>{{ item?.subject }}</td>
            <td>{{ item?.message }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

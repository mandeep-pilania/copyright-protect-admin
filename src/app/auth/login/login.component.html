<div class="d-flex vh-100 align-items-center justify-content-center bg-light">
  <form
    [formGroup]="LoginForm"
    (ngSubmit)="Login()"
    class="p-4 bg-white rounded shadow"
    style="width: 100%; max-width: 400px"
    novalidate
  >
    <h2 class="mb-4 text-center">Login</h2>

    <div class="mb-3">
      <label for="email" class="form-label">Email address</label>
      <input
        type="email"
        id="email"
        class="form-control"
        formControlName="email"
        placeholder="Enter email"
        required
        pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
        [class.is-invalid]="
          V['email'].invalid && (V['email'].dirty || V['email'].touched)
        "
      />
      <div
        *ngIf="V['email'].invalid && (V['email'].dirty || V['email'].touched)"
        class="invalid-feedback"
      >
        <div *ngIf="V['email'].errors?.['required']">Email is required.</div>
        <div *ngIf="V['email'].errors?.['pattern']">
          Please enter a valid email.
        </div>
      </div>
    </div>

    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <input
        type="password"
        id="password"
        class="form-control"
        formControlName="password"
        placeholder="Password"
        required
        [class.is-invalid]="
          V['password'].invalid &&
          (V['password'].dirty || V['password'].touched)
        "
      />
      <div
        *ngIf="
          V['password'].invalid &&
          (V['password'].dirty || V['password'].touched)
        "
        class="invalid-feedback"
      >
        <div *ngIf="V['password'].errors?.['required']">
          Password is required.
        </div>
      </div>
    </div>

    <button
      type="submit"
      class="btn btn-primary w-100"
      [disabled]="LoginForm.invalid"
    >
      Login
    </button>
  </form>
</div>
